<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #1a1a2e; color: #fff; }
    .card { background: #16213e; border: 1px solid #0f3460; }
    .card-header { background: #0f3460; }
    .btn-primary { background: #e94560; border: none; }
  </style>
</head>
<body>
  <div class="container py-4">
    <h1>WhatsApp Bot Manager</h1>
    <div class="card mb-3">
      <div class="card-header">Configuracoes</div>
      <div class="card-body">
        <textarea id="botPrompt" class="form-control mb-2" rows="4">Voce e um assistente virtual prestativo.</textarea>
        <button class="btn btn-primary" onclick="save()">Salvar</button>
      </div>
    </div>
    <div class="card">
      <div class="card-header">Webhook</div>
      <div class="card-body">
        <input id="webhook" class="form-control" readonly>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('webhook').value = window.location.origin + '/webhook';
    async function save() {
      await fetch('/api/config', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({prompt: document.getElementById('botPrompt').value})
      });
      alert('Salvo!');
    }
  </script>
</body>
</html>
